services:
  # v2.0: Main Nethical API service with semantic monitoring
  nethical-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_EMBEDDINGS: "true"  # Preload models to reduce cold start
    image: nethical:v2.7.0
    container_name: nethical-api
    environment:
      # v2.0: Semantic monitoring
      - NETHICAL_SEMANTIC=1
      - NETHICAL_INTENT_THRESHOLD=0.75
      
      # Storage and data
      - NETHICAL_STORAGE_DIR=/data/nethical
      - NETHICAL_REGION_ID=eu-central-1
      - NETHICAL_LOGICAL_DOMAIN=default
      
      # Feature flags
      - NETHICAL_ENABLE_MERKLE=true
      - NETHICAL_ENABLE_QUARANTINE=true
      - NETHICAL_ENABLE_QUOTA=true
      - NETHICAL_ENABLE_OTEL=true
      
      # Quota configuration
      - NETHICAL_REQUESTS_PER_SECOND=10.0
      - NETHICAL_MAX_PAYLOAD_BYTES=1000000
      
      # Privacy settings
      - NETHICAL_PRIVACY_MODE=differential
      - NETHICAL_EPSILON=1.0
      - NETHICAL_REDACTION_POLICY=aggressive
      
      # OpenTelemetry
      - OTEL_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=nethical-api
      
    volumes:
      - nethical-data:/data
      - ./correlation_rules.yaml:/app/correlation_rules.yaml:ro
      - ./ethics_taxonomy.json:/app/ethics_taxonomy.json:ro
    ports:
      - "8000:8000"
    networks:
      - nethical-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Redis for distributed caching, state synchronization and quota management
  redis:
    image: redis:7.4-alpine
    container_name: nethical-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nethical_cluster_secure_sync_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nethical-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nethical_cluster_secure_sync_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # OpenTelemetry Collector (pinned sovereign release)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: nethical-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    networks:
      - nethical-network
    restart: unless-stopped

  # Prometheus for telemetry and metrics (pinned sovereign release)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nethical-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nethical-network
    restart: unless-stopped

  # Grafana for institutional dashboards and visualization (pinned sovereign release)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: nethical-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-ChangeMeInProduction2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - nethical-network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  nethical-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  nethical-network:
    driver: bridge
