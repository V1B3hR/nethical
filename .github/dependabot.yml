version: 2
updates:
  # Python dependencies (Core Framework)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    reviewers:
      - "V1B3hR"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "pydantic-core"

  # Python dependencies (Nethical Edge)
  - package-ecosystem: "pip"
    directory: "/nethical-edge"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "V1B3hR"
    labels:
      - "edge"
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(edge)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "V1B3hR"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "security"
    reviewers:
      - "V1B3hR"
    commit-message:
      prefix: "docker"
