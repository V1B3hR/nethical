name: SBOM Generation and Signing

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-hashed.txt
          pip install --no-deps -e .
      
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.18.0
        with:
          path: '.'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
      
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.18.0
        with:
          path: '.'
          format: 'cyclonedx-json'
          output-file: 'sbom.cyclonedx.json'
      
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json

  sign-artifacts:
    name: Sign Artifacts with Cosign
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write  # For keyless signing with Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      
      - name: Build package
        run: |
          pip install --require-hashes -r requirements-build-hashed.txt
          python -m build
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.4
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.1
        with:
          name: sbom
      
      - name: Sign artifacts with keyless signing
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Sign wheel
          for file in dist/*.whl; do
            cosign sign-blob --yes "$file" --output-signature "${file}.sig" --output-certificate "${file}.pem" || echo "Keyless signing requires OIDC, skipping for PR"
          done
          
          # Sign SBOM
          cosign sign-blob --yes sbom.spdx.json --output-signature sbom.spdx.json.sig --output-certificate sbom.spdx.json.pem || echo "Keyless signing requires OIDC, skipping for PR"
        continue-on-error: true
      
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cd ..
          sha256sum sbom.*.json >> dist/SHA256SUMS
      
      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-artifacts
          path: |
            dist/
            *.sig
            *.pem

  provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      
      - name: Build package
        run: |
          pip install --require-hashes -r requirements-build-hashed.txt
          python -m build
      
      - name: Generate provenance (SLSA v1.0)
        run: |
          # Create a simple provenance statement
          cat > provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {
                "name": "$(ls dist/*.whl | head -1)",
                "digest": {
                  "sha256": "$(sha256sum dist/*.whl | head -1 | cut -d' ' -f1)"
                }
              }
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/actions",
                "externalParameters": {
                  "repository": "${{ github.repository }}",
                  "ref": "${{ github.ref }}",
                  "sha": "${{ github.sha }}"
                },
                "internalParameters": {
                  "github_actor": "${{ github.actor }}",
                  "github_event_name": "${{ github.event_name }}"
                }
              },
              "runDetails": {
                "builder": {
                  "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                },
                "metadata": {
                  "invocationId": "${{ github.run_id }}",
                  "startedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                }
              }
            }
          }
          EOF
      
      - name: Verify SLSA Provenance integrity
        run: |
          echo "Verifying SLSA provenance integrity..."
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          PROV_SUBJECT=$(jq -r '.subject[0].name' provenance.json)
          PROV_HASH=$(jq -r '.subject[0].digest.sha256' provenance.json)
          echo "Subject: $PROV_SUBJECT"
          echo "Attested Hash: $PROV_HASH"
          ACTUAL_HASH=$(sha256sum "$PROV_SUBJECT" | cut -d' ' -f1)
          if [ "$PROV_HASH" != "$ACTUAL_HASH" ]; then
            echo "❌ Hash mismatch! Provenance: $PROV_HASH vs Actual: $ACTUAL_HASH"
            exit 1
          fi
          echo "✅ SLSA v1.0 provenance attestation verified successfully!"

      - name: Upload provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance
          path: provenance.json
      
      - name: Attach to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./provenance.json
          asset_name: provenance.json
          asset_content_type: application/json
        continue-on-error: true
