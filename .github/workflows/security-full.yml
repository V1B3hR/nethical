name: Comprehensive Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full security scan'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # =================================================================
  # Pre-commit Security Checks
  # =================================================================
  pre-commit-security:
    name: Pre-commit Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit tools
        run: |
          pip install --require-hashes -r requirements-tools-hashed.txt

      - name: Run Gitleaks (Secrets Scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.8
        with:
          args: --redact --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Bandit (SAST)
        run: |
          bandit -r nethical/ -f json -o bandit-results.json --severity-level medium || true
          bandit -r nethical/ -f txt --severity-level medium || true
        continue-on-error: true

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-results
          path: bandit-results.json

  # =================================================================
  # Static Application Security Testing (SAST)
  # =================================================================
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.0.5
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.0.5
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.0.5
        with:
          category: "/language:python/workflow:security-pipeline"

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
        continue-on-error: true

  # =================================================================
  # Dependency Scanning
  # =================================================================
  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: |
          pip install --require-hashes -r requirements-sec-hashed.txt

      - name: Install project dependencies
        run: |
          pip install --require-hashes -r requirements-hashed.txt

      - name: Run Safety Check
        run: |
          safety check --json > safety-results.json || true
        continue-on-error: true

      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-results.json || true
        continue-on-error: true

      - name: Run Trivy (Dependency Scan)
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-dependency-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy results to Security tab
        if: always() && hashFiles('trivy-dependency-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.0.5
        with:
          sarif_file: trivy-dependency-results.sarif
          category: "/tool:trivy/workflow:security-pipeline"

      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-scan-results
          path: |
            safety-results.json
            pip-audit-results.json
            trivy-dependency-results.sarif

  # =================================================================
  # Container Security Scanning
  # =================================================================
  container-scan:
    name: Container Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Docker image
        id: docker_build
        run: |
          set -e
          docker build -t nethical:security-scan .
        continue-on-error: true

      - name: Run Trivy (Container Scan)
        if: success() && steps.docker_build.outcome == 'success'
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          image-ref: 'nethical:security-scan'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run Grype (Container Scan)
        if: success() && steps.docker_build.outcome == 'success'
        uses: anchore/scan-action@64a33b277ea7a1215a3c142735a1091341939ff5 # v4.1.2
        with:
          image: 'nethical:security-scan'
          fail-build: false
          output-format: sarif
          severity-cutoff: high
        continue-on-error: true

      - name: Upload container scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-scan-results
          path: |
            trivy-container-results.sarif

  # =================================================================
  # SBOM Generation
  # =================================================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate SBOM with Syft (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.18.0
        with:
          path: '.'
          format: 'spdx-json'
          output-file: 'sbom-spdx.json'

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.18.0
        with:
          path: '.'
          format: 'cyclonedx-json'
          output-file: 'sbom-cyclonedx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json

  # =================================================================
  # Dynamic Application Security Testing (DAST)
  # =================================================================
  dast:
    name: DAST Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.event.inputs.full_scan == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-hashed.txt

      - name: Start application
        run: |
          python -m nethical.api &
          sleep 10
        continue-on-error: true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: 'http://localhost:8000'
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-results
          path: |
            report_html.html
            report_json.json

  # =================================================================
  # Infrastructure as Code Security
  # =================================================================
  iac-security:
    name: IaC Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Checkov (IaC Security)
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # master
        with:
          directory: deploy/
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Run KICS
        uses: checkmarx/kics-github-action@4600d2f2e1dfb33fbf6e1dfd60a01fb18b202ba1 # master
        with:
          path: deploy/
          output_path: kics-results/
          output_formats: 'sarif'
        continue-on-error: true

      - name: Upload IaC scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iac-security-results
          path: |
            checkov-results.sarif
            kics-results/

  # =================================================================
  # License Compliance
  # =================================================================
  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: |
          pip install --require-hashes -r requirements-sec-hashed.txt

      - name: Install project dependencies
        run: |
          pip install --require-hashes -r requirements-hashed.txt

      - name: Generate license report
        run: |
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=markdown --output-file=licenses.md
        continue-on-error: true

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: |
            licenses.json
            licenses.md

  # =================================================================
  # Security Report Aggregation
  # =================================================================
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs:
      - pre-commit-security
      - sast
      - dependency-scan
      - container-scan
      - sbom
      - iac-security
      - license-scan
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.1
        with:
          path: security-reports

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate consolidated report
        run: |
          cat << 'EOF' > generate_report.py
          import json
          import os
          from datetime import datetime

          report = {
              "generated_at": datetime.utcnow().isoformat() + "Z",
              "repository": os.environ.get("GITHUB_REPOSITORY", "unknown"),
              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "sections": {}
          }

          sections = [
              ("bandit", "security-reports/bandit-results/bandit-results.json"),
              ("safety", "security-reports/dependency-scan-results/safety-results.json"),
              ("pip-audit", "security-reports/dependency-scan-results/pip-audit-results.json"),
              ("licenses", "security-reports/license-report/licenses.json"),
          ]

          for name, path in sections:
              if os.path.exists(path):
                  try:
                      with open(path) as f:
                          report["sections"][name] = json.load(f)
                  except Exception as e:
                      report["sections"][name] = {"error": f"Failed to parse: {e}"}
              else:
                  report["sections"][name] = {"status": "not_found"}

          with open("consolidated-security-report.json", "w") as f:
              json.dump(report, f, indent=2)

          print("Security report generated successfully")
          EOF

          python generate_report.py

      - name: Upload consolidated report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consolidated-security-report
          path: consolidated-security-report.json

      - name: Create summary
        run: |
          {
            echo "## Security Scan Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Pre-commit Security | ${{ needs.pre-commit-security.result }} |"
            echo "| SAST Analysis | ${{ needs.sast.result }} |"
            echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |"
            echo "| Container Scan | ${{ needs.container-scan.result }} |"
            echo "| SBOM Generation | ${{ needs.sbom.result }} |"
            echo "| IaC Security | ${{ needs.iac-security.result }} |"
            echo "| License Compliance | ${{ needs.license-scan.result }} |"
            echo ""
            echo "**Run ID:** ${{ github.run_id }}"
            echo "**Triggered by:** ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
