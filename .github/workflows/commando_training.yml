name: Commando Training Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-commandos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.0.0
    - name: Set up Python 3.10
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.7.1
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements-hashed.txt
        pip install --require-hashes -r requirements-tools-hashed.txt

    - name: Configure Kaggle API credentials
      run: |
        mkdir -p ~/.kaggle
        echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
        chmod 600 ~/.kaggle/kaggle.json

    - name: (Optional) Grant execution permissions to training script
      if: runner.os == 'Linux'
      run: chmod +x scripts/train_commandos.sh

    - name: Run Nethical model training
      run: |
        # CI uses a slightly more permissive ECE gate than the script default
        python training/train_any_model.py \
          --model-type all \
          --epochs 70 \
          --batch-size 64 \
          --num-samples 20000 \
          --enable-audit \
          --promotion-min-accuracy 0.85 \
          --promotion-max-ece 0.15 \
          --enable-governance \
          --enable-drift-tracking

    - name: Archive trained models
      run: |
        tar -czf models-current.tar.gz models/current/

    - name: Upload trained model artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: trained-models
        path: models-current.tar.gz
