name: CI - Lint, Test, Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-hashed.txt
          pip install --require-hashes -r requirements-dev-hashed.txt
      
      - name: Run Ruff linter (Enforced)
        run: |
          ruff check . --output-format=github

      - name: Run Ruff format check
        run: |
          ruff format --check nethical/
        continue-on-error: true

      - name: Run Mypy static typing
        run: mypy nethical/ --ignore-missing-imports
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']  # ✅ Remove '3.9'
    
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Clear Python cache and bytecode
        run: |
          echo "🧹 Removing .pyc files and __pycache__ directories"
          find . -type f -name '*.pyc' -delete
          find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          echo "✅ Cache cleared"
      
      - name: Verify source file content
        run: |
          echo "📄 Verifying semantic_primitives.py content"
          echo "File location: nethical/core/semantic_primitives.py"
          cat nethical/core/semantic_primitives.py | grep -A 25 "class SemanticPrimitive" || true
          echo ""
          echo "Checking for MODIFY_CODE definition:"
          grep -n "MODIFY_CODE" nethical/core/semantic_primitives.py || echo "⚠️  MODIFY_CODE not found in source"
      
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-hashed.txt
          pip install --require-hashes -r requirements-dev-hashed.txt
          pip install --require-hashes -r requirements-tools-hashed.txt
          pip install --no-deps -e .
      
      - name: Force-reinstall package
        run: |
          echo "🔄 Force-reinstalling nethical package"
          pip install --no-deps --no-build-isolation -e .
          echo "✅ Package reinstalled"
      
      - name: Verify Python environment
        run: |
          echo "🔍 Python environment verification"
          echo "Python version: $(python --version)"
          echo "Python executable: $(which python)"
          echo ""
          echo "📦 Installed nethical location:"
          python -c "import nethical; print(nethical.__file__)" || echo "⚠️  Failed to import nethical"
          echo ""
          echo "📝 sys.path:"
          python -c "import sys; import pprint; pprint.pprint(sys.path)"
          echo ""
          echo "🔎 Verifying SemanticPrimitive members:"
          python -c "from nethical.core.semantic_primitives import SemanticPrimitive; print('Members:', list(SemanticPrimitive.__members__.keys())); print('Has MODIFY_CODE:', 'MODIFY_CODE' in SemanticPrimitive.__members__)" || echo "⚠️  Failed to import SemanticPrimitive"
          echo ""
          echo "📍 semantic_primitives.py module location:"
          python -c "import nethical.core.semantic_primitives as sp; print(sp.__file__)" || echo "⚠️  Failed to locate module"
      
      - name: Run unit & core security tests
        run: |
          pytest tests/unit/ tests/security/ tests/api/ -v --cov=nethical --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
        if: always()
      
      - name: Run adversarial safety tests (Enforced)
        run: |
          pytest tests/adversarial/ -v --tb=short

  build:
    name: Build Package & Sign Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install build tools & dependencies
        run: |
          pip install --require-hashes -r requirements-hashed.txt
          pip install --require-hashes -r requirements-build-hashed.txt
      
      - name: Build sdist and wheel
        run: python -m build
      
      - name: Check package metadata
        run: twine check dist/*
      
      - name: Generate CycloneDX/SPDX SBOMs and PQC Signature
        run: python scripts/generate_release_sbom_and_signatures.py
      
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-package
          path: dist/
      
      - name: Upload wheel for security scan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-file
          path: dist/*.whl
